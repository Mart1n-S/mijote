name: CI

# Sur chaque pull request, et sur main pour garder un état de référence vert.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Une pull request qui reçoit un nouveau commit annule la vérification en cours.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verification:
    name: lint, types et tests
    runs-on: ubuntu-24.04
    steps:
      # Les actions sont figées par l'empreinte complète de leur commit, et
      # l'exécuteur par une version d'image. Voir docs/adr/0003-outillage-ia.md.
      - name: Récupère le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Avant setup-node, qui a besoin de pnpm pour son cache. La version de
      # pnpm vient du champ packageManager du package.json de la racine.
      - name: Installe pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Installe Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Installe les dépendances
        run: pnpm install --frozen-lockfile

      # La règle du projet dit que `pnpm audit` doit rester propre
      # (.claude/rules/security.md). Elle ne tenait jusqu'ici qu'à un
      # lancement manuel : deux vulnérabilités modérées sont arrivées par une
      # mise à jour transitive sans que rien ne proteste.
      #
      # La commande est lancée nue, sans --audit-level : toute vulnérabilité
      # fait échouer la CI, y compris une « low ». C'est voulu, parce que la
      # soupape existe déjà et qu'elle est meilleure. Une alerte qu'on décide
      # d'accepter s'ajoute à `auditConfig.ignoreGhsas` de pnpm-workspace.yaml,
      # avec sa raison, son chemin non atteignable et sa date de réexamen. Un
      # seuil, lui, ferait taire d'avance des alertes que personne n'aurait
      # lues.
      - name: Audit des dépendances
        run: pnpm audit

      - name: ESLint et Prettier
        run: pnpm lint

      - name: Vérification des types
        run: pnpm typecheck

      - name: Tests unitaires
        run: pnpm test

      # La règle de ponctuation du projet interdit le tiret long (U+2014) et le
      # tiret moyen (U+2013), voir CLAUDE.md et .claude/rules/writing-style.md.
      # Elle est mécanique : autant la tenir ici plutôt qu'en relecture.
      #
      # Les deux caractères sont construits par leurs octets UTF-8 plutôt
      # qu'écrits en clair, pour que ce fichier n'en contienne aucun : sinon le
      # contrôle se signalerait lui-même à chaque exécution, et il faudrait
      # l'exclure, donc cesser de le surveiller. E2 80 94 est le tiret long,
      # E2 80 93 le tiret moyen. Les octets plutôt qu'un échappement \u, qui
      # n'est pas étendu par tous les printf.
      #
      # Ils sont cherchés un par un avec -F, et surtout pas par une classe
      # entre crochets : git grep compare octet par octet, et une classe qui
      # réunirait ces deux caractères attraperait aussi « À », « … » et tout
      # caractère partageant un octet avec eux. C'est la seule façon fiable de
      # viser exactement ces deux points de code.
      #
      # Les exclusions de chemin, pour deux raisons différentes :
      #   - les dossiers des skills tiers contiennent des fichiers recopiés
      #     tels quels, dont l'empreinte SHA-256 est consignée dans
      #     docs/outillage-ia.md. Les corriger invaliderait cette empreinte.
      #     Chaque skill tiers est nommé un par un, et non tout
      #     .claude/skills/ : les skills écrits pour le projet y vivent aussi,
      #     et la règle de ponctuation leur vaut comme au reste de la prose.
      #     Un skill tiers installé s'ajoute donc ici en même temps qu'à
      #     l'inventaire.
      #   - pnpm-lock.yaml est engendré : son contenu n'est pas de la prose.
      #
      # Et une exclusion de ligne, pas de fichier : les deux lignes qui
      # énoncent la règle doivent citer les caractères qu'elles interdisent. On
      # vise leur formulation exacte, donc une reformulation de la règle fera
      # réapparaître le signalement, ce qui est voulu.
      - name: Ponctuation, aucun tiret long ni moyen
        run: |
          long=$(printf '\xe2\x80\x94')
          moyen=$(printf '\xe2\x80\x93')
          trouves=$(git grep -n -F -e "$long" -e "$moyen" \
            -- ':(exclude).claude/skills/frontend-design/' \
               ':(exclude).claude/skills/context7/' \
               ':(exclude)pnpm-lock.yaml' \
            | grep -vF "tiret long ($long) ni de tiret moyen ($moyen)" || true)
          if [ -n "$trouves" ]; then
            echo "$trouves"
            echo "::error::Tiret long ou moyen interdit. Utiliser deux-points, virgules ou parenthèses."
            exit 1
          fi

  e2e:
    name: playwright et axe-core
    runs-on: ubuntu-24.04
    steps:
      - name: Récupère le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Installe pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Installe Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Installe les dépendances
        run: pnpm install --frozen-lockfile

      # Chromium seul, comme dans playwright.config.ts : les autres navigateurs
      # seraient des centaines de méga-octets téléchargés à chaque exécution.
      - name: Installe Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Tests de bout en bout
        run: pnpm test:e2e
