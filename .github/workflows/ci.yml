name: CI

# Sur chaque pull request, et sur main pour garder un état de référence vert.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Une pull request qui reçoit un nouveau commit annule la vérification en cours.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verification:
    name: lint, types et tests
    runs-on: ubuntu-24.04
    steps:
      # Les actions sont figées par l'empreinte complète de leur commit, et
      # l'exécuteur par une version d'image. Voir docs/adr/0003-outillage-ia.md.
      - name: Récupère le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Avant setup-node, qui a besoin de pnpm pour son cache. La version de
      # pnpm vient du champ packageManager du package.json de la racine.
      - name: Installe pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Installe Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Installe les dépendances
        run: pnpm install --frozen-lockfile

      - name: ESLint et Prettier
        run: pnpm lint

      - name: Vérification des types
        run: pnpm typecheck

      - name: Tests unitaires
        run: pnpm test

      # Les tests de bout en bout servent une construction build:demo, qui
      # contient la page de démonstration du design system. Sans l'étape
      # ci-dessous, aucun travail de CI ne construirait plus la production, et
      # le mécanisme qui écarte cette page ne serait exercé nulle part.
      - name: Construction de production
        run: pnpm --filter @mijote/web build

      # La page de démonstration est écartée par une constante de compilation,
      # donc par du code mort éliminé au paquetage. C'est le genre de garantie
      # qui se défait sans bruit : on la vérifie sur le paquet livré lui-même.
      - name: Vérifie que la page de démonstration est hors du paquet livré
        run: |
          if grep -rlE 'DesignSystemPage|design-system' apps/web/dist; then
            echo "::error::La page de démonstration ne doit pas partir en production."
            exit 1
          fi

  e2e:
    name: playwright et axe-core
    runs-on: ubuntu-24.04
    steps:
      - name: Récupère le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Installe pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Installe Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Installe les dépendances
        run: pnpm install --frozen-lockfile

      # Chromium seul, comme dans playwright.config.ts : les autres navigateurs
      # seraient des centaines de méga-octets téléchargés à chaque exécution.
      - name: Installe Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Tests de bout en bout
        run: pnpm test:e2e
