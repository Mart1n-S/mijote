# Services de développement : PostgreSQL et Mailpit. La production tourne sur le
# homelab et ne se configure pas ici.
services:
  postgres:
    image: postgres:18.6-alpine
    container_name: mijote-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mijote}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?mot de passe requis, voir .env.example}
      POSTGRES_DB: ${POSTGRES_DB:-mijote}
    # 5433 côté hôte, et non 5432 : un PostgreSQL 16 natif tourne déjà sur le
    # poste (service Windows postgresql-x64-16) et occupe 5432. Sans ce
    # décalage, c'est lui qui répond, au risque qu'une migration écrive dans la
    # mauvaise base. Le port interne du conteneur reste 5432, celui de l'image.
    #
    # L'adresse d'écoute est nommée, et ce n'est pas un détail de forme : la
    # forme courte '5433:5432' publie sur 0.0.0.0 et sur [::], donc sur toutes
    # les interfaces de la machine. La base de développement était ainsi
    # joignable par n'importe quel voisin de réseau.
    #
    # Les deux boucles locales, et pas seulement l'IPv4 : DATABASE_URL vise
    # localhost, que Node résout ici en ::1 avant 127.0.0.1. Publier la seule
    # boucle IPv4 couperait l'API et drizzle-kit.
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
      - '[::1]:${POSTGRES_PORT:-5433}:5432'
    # Depuis la 18, l'image officielle déclare son volume sur
    # /var/lib/postgresql et non plus sur /var/lib/postgresql/data : le
    # répertoire de données vit dans un sous-dossier portant la version
    # majeure, /var/lib/postgresql/18/docker. Monter l'ancien chemin fait
    # refuser le démarrage, l'entrypoint prenant ce qu'il trouve là pour les
    # données d'une version antérieure, incompatibles.
    # PGDATA n'est pas forcé : sa valeur par défaut suit la version majeure,
    # ce qui est la disposition attendue par pg_upgrade au passage à la 19.
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # -h force un contrôle par TCP. Sans lui, pg_isready interroge la socket
      # Unix, sur laquelle le serveur temporaire de l'initialisation répond
      # déjà : le conteneur serait annoncé prêt avant de l'être vraiment.
      test:
        [
          'CMD-SHELL',
          'pg_isready -h 127.0.0.1 -p 5432 -U ${POSTGRES_USER:-mijote} -d ${POSTGRES_DB:-mijote}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Mailpit capture tous les e-mails du développement et n'en envoie aucun :
  # rien ne sort du poste, et aucune adresse réelle ne peut être écrite par
  # erreur à un destinataire réel.
  mailpit:
    image: axllent/mailpit:v1.33.0
    container_name: mijote-mailpit
    restart: unless-stopped
    environment:
      # Les messages vivent en mémoire, sans MP_DATABASE : ils disparaissent à
      # l'arrêt du conteneur, donc aucune adresse e-mail n'est conservée sur le
      # disque (security.md, données personnelles).
      MP_MAX_MESSAGES: 500
    # Adresses nommées, comme pour PostgreSQL ci-dessus et pour la même raison :
    # la forme courte '1025:1025' publierait sur toutes les interfaces, et les
    # e-mails de développement seraient lisibles par n'importe quel voisin de
    # réseau. 1025 est le SMTP, 8025 l'interface web.
    ports:
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025'
      - '[::1]:${MAILPIT_SMTP_PORT:-1025}:1025'
      - '127.0.0.1:${MAILPIT_WEB_PORT:-8025}:8025'
      - '[::1]:${MAILPIT_WEB_PORT:-8025}:8025'
    healthcheck:
      # Sous-commande de l'image elle-même : elle ne dépend ni de curl ni de
      # wget, que l'image n'a pas à fournir.
      test: ['CMD', '/mailpit', 'readyz']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
