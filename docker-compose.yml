# PostgreSQL de développement. La production tourne sur le homelab et ne se
# configure pas ici.
services:
  postgres:
    image: postgres:18.6-alpine
    container_name: mijote-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mijote}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?mot de passe requis, voir .env.example}
      POSTGRES_DB: ${POSTGRES_DB:-mijote}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-mijote} -d ${POSTGRES_DB:-mijote}']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
