# PostgreSQL de développement. La production tourne sur le homelab et ne se
# configure pas ici.
services:
  postgres:
    image: postgres:18.6-alpine
    container_name: mijote-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mijote}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?mot de passe requis, voir .env.example}
      POSTGRES_DB: ${POSTGRES_DB:-mijote}
    # 5433 côté hôte, et non 5432 : un PostgreSQL 16 natif tourne déjà sur le
    # poste (service Windows postgresql-x64-16) et occupe 5432. Sans ce
    # décalage, c'est lui qui répond, au risque qu'une migration écrive dans la
    # mauvaise base. Le port interne du conteneur reste 5432, celui de l'image.
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    # Depuis la 18, l'image officielle déclare son volume sur
    # /var/lib/postgresql et non plus sur /var/lib/postgresql/data : le
    # répertoire de données vit dans un sous-dossier portant la version
    # majeure, /var/lib/postgresql/18/docker. Monter l'ancien chemin fait
    # refuser le démarrage, l'entrypoint prenant ce qu'il trouve là pour les
    # données d'une version antérieure, incompatibles.
    # PGDATA n'est pas forcé : sa valeur par défaut suit la version majeure,
    # ce qui est la disposition attendue par pg_upgrade au passage à la 19.
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # -h force un contrôle par TCP. Sans lui, pg_isready interroge la socket
      # Unix, sur laquelle le serveur temporaire de l'initialisation répond
      # déjà : le conteneur serait annoncé prêt avant de l'être vraiment.
      test:
        [
          'CMD-SHELL',
          'pg_isready -h 127.0.0.1 -p 5432 -U ${POSTGRES_USER:-mijote} -d ${POSTGRES_DB:-mijote}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres-data:
