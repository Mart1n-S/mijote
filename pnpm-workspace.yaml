packages:
  - apps/*
  - packages/*

# pnpm bloque les scripts d'installation par défaut. esbuild a besoin du sien
# pour mettre en place son binaire natif ; il arrive par drizzle-kit et par la
# CLI NestJS. Toute autre autorisation doit être ajoutée ici sciemment.
#
# @swc/core est à false, et c'est un refus, pas un oubli : sans entrée ici,
# pnpm fait échouer l'installation entière plutôt que d'ignorer un script en
# silence. Son postinstall ne fait que vérifier que le binaire natif se charge,
# et à défaut lance un `npm install @swc/wasm`. Le binaire natif est bien
# installé (@swc/core-win32-x64-msvc en dépendance facultative, et son
# équivalent Linux en CI), donc ce script n'a rien à faire, et le laisser
# courir donnerait à l'installation le droit d'en lancer une autre.
allowBuilds:
  esbuild: true
  '@swc/core': false

# drizzle-kit charge sa configuration par @esbuild-kit/esm-loader, déprécié, qui
# réclame un esbuild antérieur à 0.25, vulnérable (GHSA-67mh-4wv8-2f99 : le
# serveur de développement d'esbuild répond à n'importe quelle origine).
# La surcharge ne vise que cette arête : écrite en plage, elle réécrirait aussi
# les dépendances de pair sur esbuild ailleurs dans l'arbre.
overrides:
  '@esbuild-kit/core-utils>esbuild': 0.25.12

# Exception d'audit, à réexaminer le 29 janvier 2027.
#
# GHSA-gcqx-w48m-w2h4 : deepmerge, empoisonnement de prototype par
# mergeObject(). Aucune version corrigée n'est publiée, et la dernière version
# de @rollup/plugin-node-resolve (16.0.3) en dépend encore, donc l'alerte n'est
# pas corrigeable par mise à jour.
#
# Gravité basse, et le chemin n'est pas atteignable à l'exécution :
# vite-plugin-pwa > workbox-build > @rollup/plugin-node-resolve > deepmerge,
# soit de l'outillage de construction, qui ne fusionne que notre propre
# configuration. Rien de ce code ne part dans le paquet livré au navigateur.
#
# À la date de réexamen : vérifier si deepmerge a publié un correctif, ou si
# @rollup/plugin-node-resolve s'en est débarrassé, et retirer cette exception
# le cas échéant.
#   npm view deepmerge versions
#   npm view @rollup/plugin-node-resolve dependencies.deepmerge

# Exception d'audit, à réexaminer le 29 janvier 2027, en même temps que la
# précédente.
#
# GHSA-g3hv-75wg-m249 : minimatch avant 11.0.1, déni de service par
# amplification de globparts. Corrigé en 11.0.1, mais aucun parent ne
# l'accepte : eslint 10.13.0 demande minimatch ^10.2.5,
# @eslint/config-array ^10.2.4 et @typescript-eslint/typescript-estree ^10.2.2.
# La dernière version d'eslint (10.14.0) demande encore ^10.2.6, donc la mise à
# jour ne corrige rien. Seul un overrides imposerait la version corrigée, sur
# 57 arêtes et en sautant une version majeure que personne ne déclare, au
# risque d'un fichier ignoré à tort sans erreur visible.
#
# Gravité modérée, et le chemin n'est pas atteignable : minimatch n'est ici que
# le moteur de correspondance des ignores d'ESLint, et les motifs viennent de
# notre eslint.config.js. Outillage de développement seulement. Rien de ce code
# ne part dans le paquet livré au navigateur.
#
# À la date de réexamen : vérifier si l'outillage ESLint accepte enfin
# minimatch 11, et retirer cette exception le cas échéant.
#   npm view eslint dependencies.minimatch
#   npm view @typescript-eslint/typescript-estree dependencies.minimatch

# Exception d'audit, à réexaminer le 29 janvier 2027, en même temps que les
# deux précédentes.
#
# GHSA-3g3m-2fjr-6pw4 : glob de 9.0.0 à 14.0.1, l'annulation par AbortSignal
# peut être contournée et le parcours du système de fichiers se poursuivre
# après l'expiration du délai. Corrigé en 14.0.2, et même situation :
# workbox-build 7.4.1 demande glob ^11.0.1, js-beautify 2.0.3 demande ^13.0.6,
# toutes deux dans leur dernière version publiée.
#
# Gravité modérée, et le chemin n'est pas atteignable : glob parcourt dist/
# pour bâtir le manifeste du service worker (par vite-plugin-pwa), et sert aux
# tests par @vue/test-utils > js-beautify. Les chemins parcourus viennent de la
# construction locale, jamais d'un tiers.
#
# À la date de réexamen : vérifier si l'un des deux parents accepte glob 14, et
# retirer cette exception le cas échéant.
#   npm view workbox-build dependencies.glob
#   npm view js-beautify dependencies.glob
# Les alertes de pnpm audit qu'on laisse passer, et la raison de chacune.
#
# C'est la seule façon de faire taire une alerte dans ce dépôt, et security.md
# demande qu'elle laisse une trace : l'avis, le chemin par lequel le paquet
# arrive, pourquoi l'alerte ne nous atteint pas, et quand la revoir.
#
# Aucun des trois paquets n'est livré : ils servent au lint, aux tests ou à la
# construction, et aucun n'entre dans le paquet servi au navigateur ni dans
# l'API. Aucun ne reçoit d'entrée extérieure non plus : les motifs et les
# fichiers qu'ils traitent sont les nôtres.
#
# Les trois ont été mesurées le 8 novembre 2026, exceptions retirées, pour
# vérifier qu'elles servent encore : les trois alertes reviennent, donc aucune
# n'a pu être supprimée.
#
# Réexamen : 8 février 2027. À cette date, vérifier si les paquets parents ont
# bougé (une version corrigée en dépendance transitive suffit à retirer
# l'entrée), et refaire la mesure ci-dessus.
auditConfig:
  ignoreGhsas:
    # deepmerge 4.3.1, faible : mergeObject() permet d'empoisonner le prototype
    # des objets rendus. https://github.com/advisories/GHSA-gcqx-w48m-w2h4
    #
    # Aucune version corrigée n'existe à ce jour, donc rien à mettre à jour.
    # Chemin : apps/web > vite-plugin-pwa 2.0.0 > workbox-build 7.4.1 >
    # @rollup/plugin-node-resolve > deepmerge. Il ne tourne qu'à la
    # construction de la PWA, et ne fusionne que nos propres options.
    - GHSA-gcqx-w48m-w2h4
    # minimatch 10.2.6, moyenne : déni de service par amplification des
    # globparts. https://github.com/advisories/GHSA-g3hv-75wg-m249
    #
    # Corrigée dans minimatch 11.0.1, qu'eslint 10.13.0 n'emploie pas encore.
    # Chemin : eslint > minimatch (et eslint > @eslint/config-array >
    # minimatch). Les motifs viennent de notre configuration de lint, pas d'une
    # entrée extérieure, et le lint ne tourne que sur nos postes et en CI.
    - GHSA-g3hv-75wg-m249
    # glob 11.1.0 et 13.0.6, moyenne : l'annulation par AbortSignal peut être
    # contournée, donc un parcours de fichiers continue après son délai.
    # https://github.com/advisories/GHSA-3g3m-2fjr-6pw4
    #
    # Corrigée dans glob 14.0.2, qu'aucun des deux parents n'emploie encore.
    # Chemins : apps/web > vite-plugin-pwa 2.0.0 > workbox-build 7.4.1 > glob,
    # et apps/web > @vue/test-utils 2.5.1 > js-beautify > glob. Construction et
    # tests seulement, sur les fichiers du dépôt, et sans délai à contourner :
    # nous n'appelons pas glob nous-mêmes.
    - GHSA-3g3m-2fjr-6pw4
